# Colour rules in our own words: HIG color, plus WCAG and house rules.
# The colour values are each project's own (project colour file, roles from tokens/roles.schema.json); these rules
# cover roles, contrast, meaning and variants. Non-text contrast is ACC-03.
# Format: docs/specs/2026-11-09-design-foundations-design.md §5 (via: hig | swiftui-defaults | wcag | house). IDs are never reused.

- id: COL-01
  rule: Body text needs a contrast ratio of at least 4.5:1 with its background, and only text of 18 points and up, or bold text, may drop to 3:1.
  why: Faint text is unreadable for people with low vision and for everyone in sunlight or on a dim screen.
  source: {topic: accessibility, anchor: "Vision", via: hig}
  platforms: [web, swift]
  web: The contrast check holds label.primary and label.secondary on every bg.* role, accent.on on accent and link on bg.primary to 4.5:1, and label.tertiary to 3:1 for large or bold text only, in light, dark and both increased-contrast modes.
  severity: must
  check: contrast

- id: COL-02
  rule: Take every colour from a semantic role token instead of writing raw colour values in components.
  why: Roles let one change of theme, mode or contrast setting update the whole interface consistently.
  source: {topic: color, anchor: "System colors", via: hig}
  platforms: [web, swift]
  web: Use var(--df-color-<role>) or the Tailwind preset colour classes; hex, rgb() and hsl() literals belong only in the project colour file.
  severity: must
  check: raw-values

- id: COL-03
  rule: Never let colour be the only way to tell things apart, show that something is interactive, or carry essential information.
  why: People with colour blindness, and anyone on a washed-out screen, would lose the meaning.
  source: {topic: color, anchor: "Inclusive color", via: hig}
  platforms: [web, swift]
  web: Grade dots also print the grade or number, In, Watch and Out signals also show a word or icon, chart series differ in shape or label too, and links inside text are underlined.
  severity: must

- id: COL-04
  rule: Give each colour a single meaning across the app, and keep the interactive colour off anything that cannot be tapped.
  why: When the same hue marks both buttons and plain text, people stop trusting it to show what is clickable.
  source: {topic: color, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: The accent and link roles are used only on controls and links; static headings, labels and decoration use label.* or a project namespace instead.
  severity: must

- id: COL-05
  rule: Reserve the status roles for state, each with one fixed meaning in every screen, and never use them as decoration or branding.
  why: Success, warning, danger and info colours only work as signals if they always mean the same thing.
  source: {topic: color, anchor: "Best practices", via: house}
  platforms: [web, swift]
  web: status.success, status.warning, status.danger and status.info carry only their own meaning; domain scales such as Pebble Picker grade bands or Beacon signals get their own namespace (grade.*, signal.*) rather than borrowing status.*.
  severity: should

- id: COL-06
  rule: Give every colour role a light value, a dark value and a stronger increased-contrast version of each.
  why: People switch appearance and turn on Increase Contrast, and a role missing a variant breaks in exactly those settings.
  source: {topic: color, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Fill the light, dark, light-hc and dark-hc slots for each role in the project colour file; tokens.css switches them on prefers-color-scheme, prefers-contrast and data-theme.
  severity: must

- id: COL-07
  rule: Make the increased-contrast variants clearly stronger than the normal ones, and make sure the high-contrast scheme passes even if the default scheme falls short.
  why: People who turn on Increase Contrast need a difference they can actually see, not a token adjustment.
  source: {topic: accessibility, anchor: "Vision", via: hig}
  platforms: [web, swift]
  web: In the hc slots push labels toward pure black or white, darken separators to opaque lines and deepen accent; verify by emulating the prefers-contrast media feature in browser devtools.
  severity: should

- id: COL-08
  rule: Use each role only for the purpose its name states, never borrowing one for a different job because the shade happens to fit.
  why: Roles are tuned for their job in every mode, so a separator used as text or a label used as a fill will fail somewhere.
  source: {topic: color, anchor: "System colors", via: hig}
  platforms: [web, swift]
  web: No separator as a text colour, no label.secondary as a background, no bg.* on text; add a project role when nothing fits.
  severity: should

- id: COL-09
  rule: Show layering with the background roles, putting primary behind the whole view, secondary on groups inside it and tertiary on groups within those.
  why: A steady step from one background level to the next tells people how content is nested.
  source: {topic: color, anchor: "iOS, iPadOS", via: hig}
  platforms: [web, swift]
  web: Page and map chrome use bg.primary, cards and sheets bg.secondary, rows inside a card bg.tertiary; settings-style grouped lists use the bg.grouped.* set instead.
  severity: should

- id: COL-10
  rule: Rank text by importance with the label roles, from primary for main content down to tertiary and quaternary for the least important.
  why: A small set of consistent text tones builds hierarchy without extra sizes or weights.
  source: {topic: color, anchor: "iOS, iPadOS", via: hig}
  platforms: [web, swift]
  web: Titles and body use label.primary, metadata such as grade source or walk time label.secondary, hints label.tertiary, and placeholder text in inputs label.placeholder.
  severity: should

- id: COL-11
  rule: Check the palette in bright daylight and in the dark, on more than one real device.
  why: Sunlight mutes colour and darkness makes it glare, and these apps are used outdoors.
  source: {topic: color, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Look at grade colours, map pins and signal badges on a phone outside at midday and in a dark room, and on both an iPhone and a desktop screen.
  severity: should

- id: COL-12
  rule: Adjust the colours of nearby interface when the artwork or imagery behind it changes character.
  why: Chrome that suits a light street map can vanish over dark satellite imagery, or the reverse.
  source: {topic: color, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: When the basemap switches to satellite, controls and labels over it switch to a dark scheme or sit on a material, so they stay legible on both.
  severity: should

- id: COL-13
  rule: Consider how colours read in other cultures before using them to signal good or bad.
  why: Red means danger in some places and good fortune in others, so colour alone can send the wrong message.
  source: {topic: color, anchor: "Inclusive color", via: hig}
  platforms: [web, swift]
  web: Pair status colour with words and icons (see COL-03) so the meaning never depends on a cultural reading.
  severity: consider

- id: COL-14
  rule: When people can pick a colour, use the platform colour picker.
  why: The built-in picker is familiar, accessible and keeps colours people saved elsewhere.
  source: {topic: color, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Use input type="color" (or a short list of named swatches) for a list or tag colour, not a hand-built picker.
  severity: consider

- id: COL-15
  rule: Embed an sRGB colour profile in images, and use wide-gamut P3 colour only as an enhancement with an sRGB fallback.
  why: Untagged or P3-only assets shift or clip on many displays.
  source: {topic: color, anchor: "Color management", via: hig}
  platforms: [web, swift]
  web: 'Export PNG and JPEG with an embedded sRGB profile; write color(display-p3 ...) only inside @media (color-gamut: p3), after an sRGB declaration of the same property.'
  severity: consider

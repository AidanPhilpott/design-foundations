# Writing rules in our own words: HIG writing (voice, tone and interface copy). Judgement rules, no automated checks.
# Format: docs/specs/2026-11-09-design-foundations-design.md §5 (via: hig | swiftui-defaults | wcag | house). IDs are never reused.

- id: WRT-01
  rule: Say things plainly and briefly, removing any word that does not earn its place.
  why: Short, clear copy is read faster and misread less, especially on a phone at the crag or trailhead.
  source: {topic: writing, anchor: "Getting started", via: hig}
  platforms: [web, swift]
  web: Prefer Saved to Your boulder has been successfully saved; read new strings aloud before shipping them.
  severity: should

- id: WRT-02
  rule: Write error messages that sit beside the problem and tell people exactly how to fix it.
  why: A message far from its cause, or one that only says something failed, leaves people guessing.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Show field errors under the field and link them with aria-describedby; write Enter a grade from V0 to V17 rather than Invalid grade.
  severity: should

- id: WRT-03
  rule: Keep error copy calm and blame-free, with no cute interjections and no bare technical verdicts.
  why: Errors are already frustrating, and jokes or robotic phrasing make them feel worse.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: No Oops or Uh-oh, no raw status codes or exception text in the UI; explain what happened in plain terms and keep technical detail for the issue report.
  severity: should

- id: WRT-04
  rule: Prevent errors before writing messages for them, and redesign any step where many people go wrong.
  why: The best error message is the one nobody needs to see.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Use input types, pickers and sensible defaults instead of free text where possible; if issue reports keep naming one error, fix the flow rather than the wording.
  severity: should

- id: WRT-05
  rule: Label buttons and links with a verb for what they do, and favour clarity over cleverness.
  why: People act on labels, and a playful phrase hides what will happen when they tap.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Save to list, Log send and Report an issue, not Let's go or Sure.
  severity: should

- id: WRT-06
  rule: Make link text describe its destination on its own, never a bare click here.
  why: Screen reader users often move through a page link by link, out of context.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Write Open the Squamish forecast or View approach details as the link text itself.
  severity: should

- id: WRT-07
  rule: Decide on the app's voice and keep a short list of preferred terms, using the same word for the same thing everywhere.
  why: Consistent vocabulary makes the app feel coherent and stops people wondering whether two words mean two things.
  source: {topic: writing, anchor: "Getting started", via: hig}
  platforms: [web, swift]
  web: Keep a glossary in each project's docs (for example boulder, problem, wall and area in Pebble Picker; In, Watch and Out in Beacon) and use it in code strings too.
  severity: should

- id: WRT-08
  rule: Adapt the tone to the moment, straightforward for problems and safety and lighter for successes.
  why: The same voice can reassure or celebrate, but a cheerful tone during a failure or a hazard feels careless.
  source: {topic: writing, anchor: "Getting started", via: hig}
  platforms: [web, swift]
  web: Avalanche and conditions warnings in Beacon stay neutral and direct; a first logged send may get a light touch.
  severity: should

- id: WRT-09
  rule: Write in simple, inclusive language that anyone can follow and that translates well, without in-house jargon or gendered terms.
  why: Plain words reach more people, including those using translation or a screen reader.
  source: {topic: writing, anchor: "Getting started", via: hig}
  platforms: [web, swift]
  web: Domain words the user knows (sit start, crimpy, multipitch) are fine; internal ones (objective id, pin, payload) are not; say they or you instead of he or she.
  severity: should

- id: WRT-10
  rule: Avoid we in interface copy, and use my or your only where needed, sticking to one perspective.
  why: It is unclear who we refers to, and needless possessives make labels longer.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Write Unable to load lists, not We couldn't load your lists; name a tab Lists rather than My Lists.
  severity: should

- id: WRT-11
  rule: Choose one capitalisation style per kind of element and apply it everywhere.
  why: Mixed casing looks careless and blurs the voice.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Record the choice in the project glossary (for example sentence case for buttons, headings and alerts) and do not mix it with CSS text-transform on some elements only.
  severity: consider

- id: WRT-12
  rule: In multi-step flows, label the step buttons consistently and make the end of the flow unmistakable.
  why: Predictable labels tell people where they are and when they are finished.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Start with Get started, move on with Next (or a label naming the next step) every time, and close with Done.
  severity: should

- id: WRT-13
  rule: Use interaction verbs that suit the device, or neutral ones when the same copy serves touch and pointer.
  why: Telling a phone user to click, or a desktop user to tap, reads as careless.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: The PWA runs on phones and desktops, so prefer select, choose or open; if a hint must name a gesture, switch the word with the pointer coarse or fine media feature.
  severity: should

- id: WRT-14
  rule: Give every empty screen a short explanation of what belongs there and a button or link to take the next step.
  why: A blank view with no guidance looks broken, and an action turns it into a starting point.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: An empty list says how to add climbs and offers a Browse map button; keep essential information out of empty states, as they vanish once content exists.
  severity: should

- id: WRT-15
  rule: Name settings plainly and, when a name is not enough, say what happens when the setting is on.
  why: People find settings faster by their effect, and can infer the off state on their own.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: A toggle labelled Offline maps with the note Downloads map tiles for saved areas, rather than an unexplained Cache.
  severity: should

- id: WRT-16
  rule: When pointing someone to a setting, take them straight there instead of describing the path.
  why: Step-by-step directions are easy to lose and go stale when menus change.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: In-app settings get a button that opens the right sheet or anchor; for browser or OS permissions that a page cannot link to, give the shortest accurate path and name the setting exactly.
  severity: should

- id: WRT-17
  rule: Label every text field visibly and show the expected format with an example or hint, phrasing any correction as an instruction.
  why: A hint up front prevents mistakes, and a positive instruction is easier to follow than a list of rules broken.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Always pair inputs with a label element; placeholder text only shows an example such as name@example.com, never replaces the label; errors read Use letters only rather than No numbers allowed.
  severity: should

- id: WRT-18
  rule: Lead each screen with what matters most, and split unrelated ideas into separate steps or screens.
  why: People skim, and one idea per view is easier to take in.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Lead a conditions card with the signal and the reason, then details; keep onboarding to one message per screen.
  severity: should

- id: WRT-19
  rule: Match how a message is delivered to its urgency, from inline text through banners and dialogs to notifications.
  why: Interrupting for something minor wears people out, while burying something urgent means it is missed.
  source: {topic: writing, anchor: "Best practices", via: hig}
  platforms: [web, swift]
  web: Inline text for field help, a dismissible banner for sync status, a dialog only for a decision that cannot wait, and push notifications only for changes the person asked to hear about, such as Beacon going to In.
  severity: should
